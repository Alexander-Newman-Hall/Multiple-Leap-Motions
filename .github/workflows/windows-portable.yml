name: Windows Release portable package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    name: MSVC x64 Release / real LeapC API / isolated portable smoke
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Install official Qt Release development packages
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.8.3'
          host: windows
          arch: win64_msvc2022_64
          archives: qtbase qtdeclarative qttools
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'
          setup-python: false
          cache: false
      - name: Fetch verified official SDK development baseline (never an artifact)
        run: python scripts/fetch-leapc-sdk.py
      - name: Configure native Release with the real SDK header adapter
        run: cmake --preset windows-release -DHANDBRIDGE_WITH_LEAPC=ON "-DLEAP_SDK_ROOT=${{ github.workspace }}/work/leapc-sdk"
      - name: Build both applications and deterministic SDK adapter tests
        run: cmake --build --preset windows-release --parallel 2
      - name: Core, real-API fake transport, OSC, model and UI tests
        run: ctest --preset windows-release --output-junit "${{ github.workspace }}/windows-release-results.xml"
      - name: Verify detached processes repeatedly without retrying past failures
        run: ctest --preset windows-release -R "^ControlIntegration$" --repeat until-fail:3 --output-on-failure --output-junit "${{ github.workspace }}/windows-release-repeat-results.xml"
      - name: Verify genuine external SDK version and required exports (no camera claim)
        run: '& ./out/build/windows-release/Release/handbridge-engine.exe --check-leapc --leapc-library "${{ github.workspace }}/work/leapc-sdk/lib/x64/LeapC.dll"'
      - name: Deploy Release applications, Qt, app-local CRT and corresponding source
        run: cmake --build --preset windows-release --target handbridge-portable
      - name: Verify clean source provenance in the package manifest
        shell: pwsh
        run: |
          $manifest = Get-Content ./out/build/windows-release/portable/HandBridge-2.0.0-windows-x64-preview/package-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.source_dirty) {
            git status --short
            throw 'CI package must identify a clean checkout; generated test evidence belongs in ignored paths.'
          }
      - name: Extract ZIP and verify Windows GUI / UDP / lifecycle without development paths
        shell: pwsh
        run: |
          $sdkBaseline = Get-Content ./cmake/leapc-sdk-baseline.json -Raw | ConvertFrom-Json
          ./scripts/Test-WindowsPortable.ps1 `
            -Archive ./out/build/windows-release/portable/HandBridge-2.0.0-windows-x64-preview.zip `
            -OutputDirectory "${{ runner.temp }}/handbridge-portable-smoke" `
            -ExternalLeapCLibrary "${{ github.workspace }}/work/leapc-sdk/lib/x64/LeapC.dll" `
            -ExpectedLeapCVersion $sdkBaseline.dll_file_version
      - name: Print Qt diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem ./out/build/windows-release/qt-*.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host $_.Name
            Get-Content -LiteralPath $_.FullName
          }
      - name: Upload portable developer preview (hardware unverified; external LeapC required)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HandBridge-2.0.0-windows-x64-preview
          path: |
            out/build/windows-release/portable/HandBridge-2.0.0-windows-x64-preview.zip
            out/build/windows-release/portable/HandBridge-2.0.0-windows-x64-preview.zip.sha256
            out/build/windows-release/portable/HandBridge-2.0.0-windows-x64-preview/package-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload logs and actual native Windows captures (no SDK binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-deployment-evidence
          path: |
            windows-release-results.xml
            windows-release-repeat-results.xml
            out/build/windows-release/Testing/Temporary/LastTest.log
            out/build/windows-release/qt-*.txt
            ${{ runner.temp }}/handbridge-portable-smoke/portable-smoke.json
            ${{ runner.temp }}/handbridge-portable-smoke/*.png
            ${{ runner.temp }}/handbridge-portable-smoke/*.txt
          if-no-files-found: warn
