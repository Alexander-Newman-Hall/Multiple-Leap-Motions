name: macOS M2 concurrency (SDK-free)
on:
  push:
    branches: [codex/handbridge-macos-feasibility]
    paths: ['src/**', 'tests/**', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/macos-concurrency.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Record actual compiler and platform (original feature probes not repeated)
        run: |
          mkdir -p work
          sw_vers
          uname -m
          xcodebuild -version
          xcrun clang++ --version
          xcrun --sdk macosx --show-sdk-version
          printf '#include <version>\n' | xcrun clang++ -std=c++20 -dM -E -x c++ - | grep '_LIBCPP_VERSION '
      - name: Pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Pinned Qt dependencies for existing headless IPC host
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.8.3'
          host: mac
          arch: clang_64
          archives: qtbase qtdeclarative qttools
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'
          setup-python: false
          cache: false
      - name: Build and test Qt-free host
        id: core
        continue-on-error: true
        run: |
          cmake --preset macos-intel-core
          cmake --build --preset macos-intel-core --parallel 2
          ctest --preset macos-intel-core --output-junit "$GITHUB_WORKSPACE/work/macos-core.xml"
      - name: Build existing QtCore/Network engine and SDK-free tests (no GUI target)
        id: control_build
        run: |
          cmake --preset macos-intel-control
          cmake --build --preset macos-intel-control --parallel 2 --target \
            handbridge-engine test_WorkerConcurrency test_ConfigManager \
            test_DeviceAliasManager test_LeapSorter test_LegacyOscContract \
            test_EngineRuntime test_ControlSettings test_Processing
      - name: Host concurrency, shutdown, legacy UDP and core regressions
        id: control_tests
        continue-on-error: true
        run: |
          ctest --preset macos-intel-control -E '^(ControllerModel|ControlUi|ControlIntegration)$' \
            --output-junit "$GITHUB_WORKSPACE/work/macos-control-host.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-concurrency-build-mock-evidence
          path: |
            work/macos-*.xml
            out/build/macos-intel-*/Testing/Temporary/LastTest.log
          retention-days: 14
      - name: Preserve failures from both independent suites
        if: always() && (steps.core.outcome != 'success' || steps.control_build.outcome != 'success' || steps.control_tests.outcome != 'success')
        run: exit 1
