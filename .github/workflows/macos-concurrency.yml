name: Apple Silicon arm64 validation
on:
  push:
    branches: [codex/handbridge-macos-feasibility]
    paths: ['src/**', 'tests/**', 'probes/macos-m0/**', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/macos-concurrency.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: Native arm64 image only
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Require native Apple Silicon and record actual toolchain
        run: |
          set -euo pipefail
          mkdir -p work
          exec > >(tee work/arm64-environment.txt) 2>&1
          test "$(uname -m)" = arm64
          test "$(sysctl -in sysctl.proc_translated)" != 1
          python -c 'import platform; assert platform.machine() == "arm64", platform.machine()'
          sw_vers
          uname -a
          system_profiler SPHardwareDataType | sed '/Serial Number/d; /Hardware UUID/d; /Provisioning UDID/d'
          xcodebuild -version
          xcrun clang++ --version
          xcrun --sdk macosx --show-sdk-version
          printf '#include <version>\n' | xcrun clang++ -std=c++20 -dM -E -x c++ - | grep '_LIBCPP_VERSION '
      - name: Pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Genuine pinned Apple Silicon Hyperion 6.2 SDK offline checks
        id: sdk
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p work/macos-m0
          exec > >(tee work/macos-m0/arm64-sdk-results.txt) 2>&1
          bash probes/macos-m0/fetch-sdk.sh
          python probes/macos-m0/run-sdk.py
      - name: Pinned Qt dependencies (native arm64 slice selected by presets)
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.8.3'
          host: mac
          arch: clang_64
          archives: qtbase qtdeclarative qttools
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'
          setup-python: false
          cache: false
      - name: Build and test native arm64 Qt-free engine
        id: core
        continue-on-error: true
        run: |
          cmake --preset macos-arm64-core
          cmake --build --preset macos-arm64-core --parallel 2
          ctest --preset macos-arm64-core --output-junit "$GITHUB_WORKSPACE/work/macos-core.xml"
      - name: Build existing arm64 engine, GUI and tests
        id: control_build
        continue-on-error: true
        run: |
          options=(-DHANDBRIDGE_WITH_LEAPC=OFF)
          if [ "${{ steps.sdk.outcome }}" = success ]; then
            options=(-DHANDBRIDGE_WITH_LEAPC=ON "-DLEAP_SDK_ROOT=$(cat work/macos-m0/sdk-root.txt)")
          else
            echo 'SDK unavailable: engine/GUI mock checks proceed, SDK acceptance remains failed.'
          fi
          cmake --preset macos-arm64-control "${options[@]}"
          cmake --build --preset macos-arm64-control --parallel 2
      - name: Require arm64-only application executables
        id: slices
        if: steps.control_build.outcome == 'success'
        run: |
          set -euo pipefail
          for binary in out/build/macos-arm64-core/handbridge-engine out/build/macos-arm64-control/handbridge-engine out/build/macos-arm64-control/handbridge-control; do
            file "$binary"
            test "$(lipo -archs "$binary")" = arm64
            otool -L "$binary"
          done
      - name: Full arm64 core, GUI, OSC, SDK-type and lifecycle suites
        id: control_tests
        if: steps.control_build.outcome == 'success' && steps.slices.outcome == 'success'
        continue-on-error: true
        run: |
          ctest --preset macos-arm64-control --output-junit "$GITHUB_WORKSPACE/work/macos-control.xml"
      - name: Native Cocoa GUI close, kill and reopen with continuing mock UDP
        id: native_gui
        if: steps.control_build.outcome == 'success' && steps.slices.outcome == 'success'
        continue-on-error: true
        run: |
          QT_QPA_PLATFORM=cocoa ctest --preset macos-arm64-control -R '^MacMenuBar$' --output-on-failure
          python tests/test_MacNativeGui.py out/build/macos-arm64-control/handbridge-engine out/build/macos-arm64-control/handbridge-control
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apple-silicon-arm64-evidence
          path: |
            work/arm64-environment.txt
            work/macos-m0/arm64-sdk-results.txt
            work/mac-native-gui/
            work/macos-*.xml
            out/build/macos-arm64-*/Testing/Temporary/LastTest.log
            out/build/macos-arm64-*/qt-*.txt
          retention-days: 14
      - name: Require every independent arm64 check
        if: always() && (steps.sdk.outcome != 'success' || steps.core.outcome != 'success' || steps.control_build.outcome != 'success' || steps.slices.outcome != 'success' || steps.control_tests.outcome != 'success' || steps.native_gui.outcome != 'success')
        run: exit 1
