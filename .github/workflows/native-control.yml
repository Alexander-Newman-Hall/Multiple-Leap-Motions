name: Native Qt controller and local IPC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-control:
    name: ${{ matrix.os }} Qt6 controller/mock IPC
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: control-debug
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_archives: qtbase qtdeclarative qttools icu
          - os: windows-2022
            preset: windows-control
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_archives: qtbase qtdeclarative qttools
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Install pinned official Qt development packages
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          archives: ${{ matrix.qt_archives }}
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'
          setup-python: false
          cache: false
      - name: Configure native controller and headless IPC host
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Core, processing, local IPC and detached UI tests
        run: ctest --preset ${{ matrix.preset }} --output-junit "${{ github.workspace }}/native-control-results.xml"
      - name: Print native Qt test diagnostics
        if: always()
        shell: python
        run: |
          from pathlib import Path
          for path in sorted(Path("out/build/${{ matrix.preset }}").glob("qt-*.txt")):
              print(path.name)
              print(path.read_text(encoding="utf-8", errors="replace"))
      - name: Upload test evidence (not a hardware release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-control-test-results-${{ matrix.os }}
          path: |
            native-control-results.xml
            out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            out/build/${{ matrix.preset }}/qt-*.txt
          if-no-files-found: warn
