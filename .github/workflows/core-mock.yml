name: SDK-free core and simulated engine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-mock:
    name: ${{ matrix.os }} C++20 core/mock tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: core-debug
          - os: windows-2022
            preset: windows-core
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned configure tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Configure without SDK or GUI
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Unit, fault injection, and loopback receiver tests
        run: ctest --preset ${{ matrix.preset }} --output-junit core-mock-results.xml
      - name: Upload test results only (no hardware product binary)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-free-test-results-${{ matrix.os }}
          path: |
            core-mock-results.xml
            out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
