name: macOS M0 feasibility
on:
  push:
    branches: [codex/handbridge-macos-feasibility]
    paths: ['probes/macos-m0/**', '.github/workflows/macos-m0.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted Mac image for M0 only
        type: choice
        options: [macos-15, macos-26, macos-15-intel]
        default: macos-15
      probe_features:
        description: Re-audit original library features (known Xcode 16.4 failures)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect host and probe C++ library
        id: features
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/macos-m0
          exec > >(tee work/macos-m0/results.txt) 2>&1
          uname -a
          sw_vers
          system_profiler SPHardwareDataType | sed '/Serial Number/d; /Hardware UUID/d; /Provisioning UDID/d'
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun clang++ --version
          cmake --version
          echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET-unset}"
          printf '#include <version>\n' | xcrun clang++ -std=c++20 -dM -E -x c++ - | sort
          if [ "${{ inputs.probe_features }}" = true ]; then
            python3 probes/macos-m0/run-features.py
          else
            echo 'Original feature probes not repeated; see docs/reports/MACOS_M0.md for measured failures.'
          fi
      - name: Inspect official Mac SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee work/macos-m0/sdk-results.txt) 2>&1
          case "$(uname -m)" in
            arm64) platform=apple-silicon ;;
            x86_64) platform=apple-intel ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 "https://s3.eu-west-1.amazonaws.com/downloads.ultraleap.com/software/tracking-software/6.2.0/tracking-software-$platform-6.2.0.pkg" -o work/macos-m0/hyperion.pkg
          shasum -a 256 work/macos-m0/hyperion.pkg
          if [ "$platform" = apple-silicon ]; then
            echo '9cad82a6282e322d2acd71f3746e50b472f3ed83bb5f9fa6f54d554f404c5531  work/macos-m0/hyperion.pkg' | shasum -a 256 -c -
          else
            echo 'cb6279bacbda12b0e2db2eda5f1e1fd1988f77f568680150e63aee474d6552bc  work/macos-m0/hyperion.pkg' | shasum -a 256 -c -
          fi
          pkgutil --check-signature work/macos-m0/hyperion.pkg
          pkgutil --expand-full work/macos-m0/hyperion.pkg work/macos-m0/sdk
          find work/macos-m0/sdk -type f | sort
          find work/macos-m0/sdk -name LeapC.h -exec shasum -a 256 {} \; > work/macos-m0/header-inspection.txt
          find work/macos-m0/sdk -iname '*leapc*dylib*' -exec ls -l {} \; -exec file {} \; -exec lipo -info {} \; -exec otool -L {} \; -exec shasum -a 256 {} \; -exec nm -gU {} \;
      - name: Build and run bounded SDK diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 probes/macos-m0/run-sdk.py 2>&1 | tee work/macos-m0/diagnostic-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-m0-evidence
          path: |
            work/macos-m0/results.txt
            work/macos-m0/sdk-results.txt
            work/macos-m0/diagnostic-results.txt
          retention-days: 14
      - name: Require successful Apple library probes
        if: always() && steps.features.outcome != 'success'
        run: exit 1
